    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Represents the data needed to create a pull request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          spec:
            properties:
              completionOptions:
                description: Preferences about how the pull request should be completed.
                properties:
                  autoCompleteIgnoreConfigIds:
                    description: List of any policy configuration Id's which auto-complete
                      should not wait for. Only applies to optional policies (isBlocking
                      == false). Auto-complete always waits for required policies
                      (isBlocking == true).
                    items:
                      type: integer
                    type: array
                  bypassPolicy:
                    description: If true, policies will be explicitly bypassed while
                      the pull request is completed.
                    type: boolean
                  bypassReason:
                    description: If policies are bypassed, this reason is stored as
                      to why bypass was used.
                    type: string
                  deleteSourceBranch:
                    description: If true, the source branch of the pull request will
                      be deleted after completion.
                    type: boolean
                  mergeCommitMessage:
                    description: If set, this will be used as the commit message of
                      the merge commit.
                    type: string
                  mergeStrategy:
                    description: Specify the strategy used to merge the pull request
                      during completion. If MergeStrategy is not set to any value,
                      a no-FF merge will be created if SquashMerge == false. If MergeStrategy
                      is not set to any value, the pull request commits will be squashed
                      if SquashMerge == true. The SquashMerge property is deprecated.
                      It is recommended that you explicitly set MergeStrategy in all
                      cases. If an explicit value is provided for MergeStrategy, the
                      SquashMerge property will be ignored.
                    enum:
                    - noFastForward
                    - squash
                    - rebase
                    - rebaseMerge
                    type: string
                  squashMerge:
                    description: SquashMerge is deprecated. You should explicitly
                      set the value of MergeStrategy. If MergeStrategy is set to any
                      value, the SquashMerge value will be ignored. If MergeStrategy
                      is not set, the merge strategy will be no-fast-forward if this
                      flag is false, or squash if true.
                    type: boolean
                  transitionWorkItems:
                    description: If true, we will attempt to transition any work items
                      linked to the pull request into the next logical state (i.e.
                      Active -> Resolved)
                    type: boolean
                type: object
              configurationRef:
                description: A reference to the Configuration CR that holds all the
                  needed configuration for this resource. OASGen Provider added this
                  field automatically.
                properties:
                  name:
                    type: string
                  namespace:
                    description: Namespace of the referenced Configuration CR. If
                      not provided, the same namespace will be used.
                    type: string
                required:
                - name
                type: object
              description:
                description: The description of the pull request.
                type: string
              isDraft:
                description: Draft / WIP pull request.
                type: boolean
              mergeOptions:
                description: The options which are used when a pull request merge
                  is created.
                properties:
                  conflictAuthorshipCommits:
                    description: If true, conflict resolutions applied during the
                      merge will be put in separate commits to preserve authorship
                      info for git blame, etc.
                    type: boolean
                  detectRenameFalsePositives:
                    description: If true, renames where there is more than one valid
                      way to map the original file locations to renamed file locations
                      will be treated as false positives and ignored.
                    type: boolean
                  disableRenames:
                    description: If true, rename detection will not be performed during
                      the merge.
                    type: boolean
                type: object
              organization:
                description: 'PARAMETER: path - Organization name'
                type: string
              project:
                description: 'PARAMETER: path - Project name or ID'
                type: string
              repositoryId:
                description: 'PARAMETER: path - Repository ID'
                type: string
              sourceRefName:
                description: The name of the source branch of the pull request.
                type: string
              status:
                description: The status of the pull request.
                enum:
                - notSet
                - active
                - abandoned
                - completed
                - all
                type: string
              supportsIterations:
                description: If true, this pull request supports multiple iterations.
                  Iteration support means individual pushes to the source branch of
                  the pull request can be reviewed and comments left in one iteration
                  will be tracked across future iterations.
                type: boolean
              targetRefName:
                description: The name of the target branch of the pull request.
                type: string
              title:
                description: The title of the pull request.
                type: string
            required:
            - configurationRef
            - organization
            - project
            - repositoryId
            type: object
          status:

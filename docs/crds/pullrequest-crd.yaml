                    type: string
                type: object
              closedDate:
                description: 'The date when the pull request was closed (completed,
                  abandoned, or merged externally). (format: date-time)'
                type: string
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
